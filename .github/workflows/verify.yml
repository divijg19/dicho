name: verify

on:
  push:
    branches:
      - main
      - 'v*'
  pull_request:
    branches:
      - main
      - 'v*'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.100.0
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt,clippy

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python 3.15
        run: uv python install 3.15

      - name: Sync Python package
        run: uv sync --project python

      - name: Python tests
        run: uv run --project python python -m unittest discover -s python/tests

      - name: Validate corpus
        run: uv run --project python python -m dicho_data validate

      - name: Regenerate derived data
        run: uv run --project python python -m dicho_data regenerate

      - name: Check generated artifacts are committed
        run: git diff --exit-code -- data/imported data/processed data/artifacts

      - name: Rust formatting
        run: cargo +1.100.0 fmt --all -- --check

      - name: Rust clippy
        run: cargo +1.100.0 clippy --all-targets -- -D warnings

      - name: Rust tests
        run: cargo +1.100.0 test
