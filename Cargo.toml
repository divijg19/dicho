[package]
name = "dicho"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "A local-first Spanish language companion for your terminal"
license = "MIT"
repository = "https://github.com/divijg19/dicho"
readme = "README.md"
keywords = ["spanish", "language-learning", "cli"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
