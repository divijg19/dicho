[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dicho-data"
version = "0.3.3"
description = "Offline data preparation and analysis for dicho"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.1,<4",
    "polars>=2.2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
